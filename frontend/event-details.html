<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Agentic Fest 2026</h1>
            <nav>
                <a href="index.html">Events</a>
                <a href="assistant.html">Ask AI</a>
            </nav>
        </header>
        
        <div id="eventContent" class="card">
            Loading...
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const eventId = params.get('id');
            
            try {
                const event = await fetchAPI(`/events/${eventId}`, { headers: { 'X-Role': 'participant' } });
                const content = document.getElementById('eventContent');
                
                content.innerHTML = `
                    <h2>${event.name}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">${event.description}</p>
                    
                    <div class="grid">
                        <div>
                            <h3>Details</h3>
                            <ul style="color: var(--text-muted);">
                                <li><strong>Date:</strong> ${event.date}</li>
                                <li><strong>Time:</strong> ${event.time}</li>
                                <li><strong>Venue:</strong> ${event.venue}</li>
                                <li><strong>Registration Fee:</strong> ₹${event.fee}</li>
                            </ul>
                        </div>
                        <div>
                            <h3>Eligibility</h3>
                            <ul style="color: var(--text-muted);">
                                <li><strong>Years:</strong> ${event.min_year} - ${event.max_year}</li>
                                <li><strong>Branches:</strong> ${event.allowed_branches.join(', ')}</li>
                                <li><strong>Team Size:</strong> ${event.min_team_size} - ${event.max_team_size} members</li>
                                <li><strong>Total Slots:</strong> ${event.max_teams} teams</li>
                            </ul>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 1.5rem;">Rules</h3>
                    <ul style="color: var(--text-muted);">
                        ${event.rules.map(r => `<li>${r}</li>`).join('')}
                    </ul>
                    
                    <div style="margin-top: 2rem;">
                        <a href="register.html?id=${event.id}" class="btn" style="padding: 1rem 2rem; font-size: 1.1rem;">Register Now</a>
                    </div>
                `;
            } catch (error) {
                document.getElementById('eventContent').innerHTML = '<p class="danger">Failed to load event details.</p>';
            }
        });
    </script>
</body>
</html>
