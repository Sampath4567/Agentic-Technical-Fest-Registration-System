<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Register for Event</h1>
            <nav><a href="index.html">Back to Events</a></nav>
        </header>
        
        <div class="card">
            <h2 id="eventName">Loading...</h2>
            <form id="regForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="teamName" required>
                </div>
                
                <div id="membersContainer"></div>
                
                <div style="margin-top: 1rem; margin-bottom: 2rem;">
                    <button type="button" id="addMemberBtn" class="btn" style="background: #374151;">+ Add Member</button>
                    <button type="button" id="removeMemberBtn" class="btn" style="background: var(--danger); display: none;">- Remove Member</button>
                </div>
                
                <div style="background: #374151; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem;">
                    <h3>Payment Verification (Mock)</h3>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">This is a simulated payment for demonstration purposes. No real money will be processed.</p>
                    <p style="font-weight: bold; margin: 0.5rem 0;">Registration Fee: <span id="feeAmount">₹0</span></p>
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="mockPayment" style="width: auto;">
                        Yes, I have completed the mock payment
                    </label>
                </div>
                
                <button type="submit" class="btn" style="width: 100%; padding: 1rem; font-size: 1.1rem;">Submit Registration</button>
                <div id="errorMsg" class="badge danger" style="display: none; margin-top: 1rem; width: 100%; box-sizing: border-box;"></div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let event = null;
        let memberCount = 0;

        function addMemberForm() {
            if (memberCount >= event.max_team_size) return;
            memberCount++;
            
            const div = document.createElement('div');
            div.id = `member-${memberCount}`;
            div.style = "border: 1px solid #4B5563; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;";
            div.innerHTML = `
                <h3>${memberCount === 1 ? 'Team Leader' : `Member ${memberCount}`}</h3>
                <div class="grid">
                    <div class="form-group"><label>Name</label><input type="text" class="m-name" required></div>
                    <div class="form-group"><label>Email</label><input type="email" class="m-email" required></div>
                    <div class="form-group"><label>Phone</label><input type="text" class="m-phone" required></div>
                    <div class="form-group"><label>Year</label><input type="number" class="m-year" min="1" max="4" required></div>
                    <div class="form-group"><label>Branch</label><input type="text" class="m-branch" required placeholder="e.g., CSE"></div>
                    <div class="form-group"><label>College</label><input type="text" class="m-college" required></div>
                </div>
            `;
            document.getElementById('membersContainer').appendChild(div);
            updateButtons();
        }

        function removeMemberForm() {
            if (memberCount <= event.min_team_size) return;
            document.getElementById(`member-${memberCount}`).remove();
            memberCount--;
            updateButtons();
        }

        function updateButtons() {
            document.getElementById('addMemberBtn').style.display = memberCount < event.max_team_size ? 'inline-block' : 'none';
            document.getElementById('removeMemberBtn').style.display = memberCount > event.min_team_size ? 'inline-block' : 'none';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const eventId = params.get('id');
            
            try {
                event = await fetchAPI(`/events/${eventId}`, { headers: { 'X-Role': 'participant' } });
                document.getElementById('eventName').innerText = event.name;
                document.getElementById('feeAmount').innerText = `₹${event.fee}`;
                
                for(let i=0; i<event.min_team_size; i++) addMemberForm();
                
                document.getElementById('addMemberBtn').onclick = addMemberForm;
                document.getElementById('removeMemberBtn').onclick = removeMemberForm;
            } catch (error) {
                alert('Event not found');
            }
        });

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const members = [];
            for (let i = 1; i <= memberCount; i++) {
                const el = document.getElementById(`member-${i}`);
                members.push({
                    name: el.querySelector('.m-name').value,
                    email: el.querySelector('.m-email').value,
                    phone: el.querySelector('.m-phone').value,
                    year: parseInt(el.querySelector('.m-year').value),
                    branch: el.querySelector('.m-branch').value.toUpperCase(),
                    college: el.querySelector('.m-college').value
                });
            }
            
            const data = {
                event_id: event.id,
                team_name: document.getElementById('teamName').value,
                members: members,
                payment_confirmed: document.getElementById('mockPayment').checked
            };
            
            try {
                const res = await fetchAPI('/register', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'X-Role': 'participant' }
                });
                
                window.location.href = `result.html?id=${res.registration_id}`;
            } catch (error) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.innerText = error.message;
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
