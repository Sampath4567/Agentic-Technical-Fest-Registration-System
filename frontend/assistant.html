<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-box { height: 400px; overflow-y: auto; background: #374151; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .msg { max-width: 80%; padding: 0.75rem 1rem; border-radius: 0.5rem; }
        .user-msg { background: var(--primary); align-self: flex-end; }
        .bot-msg { background: #1F2937; align-self: flex-start; border: 1px solid #4B5563; }
        .source { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">RAG Event Assistant</h1>
            <nav><a href="index.html">Events</a></nav>
        </header>
        
        <div class="card">
            <div id="chat" class="chat-box">
                <div class="msg bot-msg">Hello! I can answer questions about event rules, schedules, eligibility, and FAQs. Ask me anything!</div>
            </div>
            
            <form id="askForm" style="display: flex; gap: 1rem;">
                <input type="text" id="question" style="flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #4B5563; background: #374151; color: white;" placeholder="e.g. Can first-year students participate in Hackathon?" required>
                <button type="submit" class="btn">Send</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('askForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('question');
            const question = input.value;
            input.value = '';
            
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user-msg">${question}</div>`;
            chat.scrollTop = chat.scrollHeight;
            
            const loadingId = 'load-' + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="msg bot-msg" style="opacity: 0.7;">Thinking...</div>`;
            chat.scrollTop = chat.scrollHeight;
            
            try {
                const res = await fetchAPI('/ask_event', {
                    method: 'POST',
                    body: JSON.stringify({ question }),
                    headers: { 'X-Role': 'participant' }
                });
                
                document.getElementById(loadingId).remove();
                
                let sourcesHtml = '';
                if (res.sources && res.sources.length > 0) {
                    sourcesHtml = '<div class="source"><strong>Sources:</strong> ' + res.sources.map(s => s.title).join(', ') + '</div>';
                }
                
                chat.innerHTML += `<div class="msg bot-msg">${res.answer.replace(/\n/g, '<br>')}${sourcesHtml}</div>`;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="msg bot-msg" style="color: var(--danger);">Sorry, an error occurred.</div>`;
            }
            
            chat.scrollTop = chat.scrollHeight;
        });
    </script>
</body>
</html>
